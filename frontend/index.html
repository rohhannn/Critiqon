<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-KG21TB2S5H"
    ></script>

    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      gtag("js", new Date());
      gtag("config", "G-KG21TB2S5H");
    </script>

    <!-- =====================================================
         PRIMARY SEO
    ====================================================== -->

    <title>
      Critiqon – AI Resume Analyzer, Job Matching & Interview Prep
    </title>

    <meta
      name="description"
      content="Critiqon is an AI-powered career platform for resume analysis, job matching, cover letters, and interview preparation."
    />

    <link
      rel="canonical"
      href="https://critiqon.com/"
    />

    <!-- =====================================================
         WEBSITE & BROWSER
    ====================================================== -->

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#16735a"
    />

    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link
      rel="icon"
      type="image/png"
      href="/images/critiqon-icon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/images/critiqon-icon.png"
    />

    <!-- =====================================================
         OPEN GRAPH / SOCIAL SHARING
    ====================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://critiqon.com/"
    />

    <meta
      property="og:title"
      content="Critiqon – AI Resume Analyzer, Job Matching & Interview Prep"
    />

    <meta
      property="og:description"
      content="Analyze your resume, match with jobs, create cover letters, and prepare for interviews with AI."
    />

    <meta
      property="og:site_name"
      content="Critiqon"
    />

    <!-- =====================================================
         TWITTER / X
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="Critiqon – AI Resume Analyzer, Job Matching & Interview Prep"
    />

    <meta
      name="twitter:description"
      content="AI-powered resume analysis, job matching, cover letters, and interview preparation."
    />

    <!-- =====================================================
         STRUCTURED DATA: WEBSITE
    ====================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Critiqon",
        "alternateName": "critiqon.com",
        "url": "https://critiqon.com/"
      }
    </script>

    <!-- =====================================================
         STRUCTURED DATA: ORGANIZATION
    ====================================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://critiqon.com/#organization",
        "name": "Critiqon",
        "url": "https://critiqon.com/",
        "logo": "https://critiqon.com/images/critiqon-icon.png",
        "description": "Critiqon is an AI-powered career platform for resume analysis, ATS optimization, job matching, cover letters, and interview preparation."
      }
    </script>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
